<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<meta name="color-scheme" content="light">
<meta name="theme-color" content="#1f2a44">
<link rel="icon" href="data:,">
<title>Anciens sujets d'examen de physique – index par thème</title>
<style>
:root{--bg:#eef1f6;--card:#fff;--ink:#141a2b;--mute:#5d6678;--line:#dfe3ec;
--f:#16a34a;--ft:#dcfce7;--fd:#166534;--m:#f59f00;--mt:#fff1d6;--md:#9a5a00;--d:#dc2626;--dt:#fee2e2;--dd:#991b1b}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;background:var(--bg);color:var(--ink);font-size:15px;line-height:1.4;-webkit-text-size-adjust:100%}
button{font:inherit;cursor:pointer;-webkit-tap-highlight-color:transparent}
.top{background:#1f2a44;color:#fff;padding:14px 16px 16px}
.top h1{font-size:19px;line-height:1.2;margin:0;max-width:720px;margin:0 auto}
.top p{margin:4px auto 0;max-width:720px;font-size:13px;color:#c5cde0}
.wrap{max-width:720px;margin:0 auto;padding:14px 10px 30px}
/* Blocs de filtres */
.blk{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:12px 10px 14px;margin:0 0 14px;box-shadow:0 1px 3px rgba(16,24,40,.06)}
.blk h2{display:flex;align-items:center;gap:9px;margin:0 0 11px;font-size:13px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:#344054}
.blk h2 .num{flex:0 0 auto;width:24px;height:24px;border-radius:50%;background:#1f2a44;color:#fff;display:inline-flex;align-items:center;justify-content:center;font-size:13px;letter-spacing:0}
.blk h2 .sel{margin-left:auto;font-size:12px;font-weight:600;letter-spacing:0;text-transform:none;color:var(--mute);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:55%}
/* 1. Catégories : grandes tuiles colorées */
.cats{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.cat{display:flex;align-items:center;gap:8px;min-height:52px;padding:6px 9px;border-radius:12px;border:2px solid transparent;background:var(--t);color:var(--d);font-weight:700;font-size:14px;text-align:left;line-height:1.15}
.cat.all{grid-column:1/-1}
.cat .ce{font-size:18px;width:22px;text-align:center;flex:0 0 auto}
.cat .cn{flex:1 1 auto;min-width:0;display:flex;flex-direction:column;gap:2px;overflow-wrap:anywhere}
.cat .cc{font-size:12px;font-weight:600;opacity:.8}
.cat.all .cn{flex-direction:row;align-items:baseline;gap:8px}
.cat[aria-pressed=true]{background:var(--c);color:var(--on);border-color:var(--d);box-shadow:0 3px 10px rgba(16,24,40,.22)}
.cat[aria-pressed=true] .cc{opacity:.95}
.cat.zero:not([aria-pressed=true]){opacity:.5}
/* 2. Sous-catégories : petites pastilles à contour */
.blk.b2{background:var(--t,#fff);border-color:var(--c2,var(--line))}
.subs{display:flex;flex-wrap:wrap;gap:8px}
.sub{min-height:38px;padding:6px 13px;border-radius:999px;border:1.5px solid var(--c);background:#fff;color:var(--d);font-size:13.5px;font-weight:600}
.sub .n{font-weight:700;font-size:12px;opacity:.65;margin-left:5px;white-space:nowrap}
.sub{text-align:left;line-height:1.2}
.sub.zero:not([aria-pressed=true]){border-style:dashed}
.sub[aria-pressed=true]{background:var(--d);border-color:var(--d);color:#fff}
.sub[aria-pressed=true]::before{content:"✓ "}
.sub[aria-pressed=true] .n{opacity:.85}
.hint{font-size:13.5px;color:var(--mute);margin:0}
.blk.b2.off{padding-bottom:12px}
.blk.b2.off h2{margin-bottom:4px}
/* 3. Niveau : contrôle segmenté */
.seg{display:grid;grid-template-columns:repeat(4,1fr);gap:4px;background:#e9ecf2;border-radius:14px;padding:4px}
.lv{border:0;border-radius:10px;min-height:54px;padding:4px 2px;background:var(--lt);color:var(--ld);display:flex;flex-direction:column;align-items:center;justify-content:center;font-weight:800;font-size:15px;line-height:1.15}
.lv .n{font-size:12px;font-weight:700;opacity:.75;margin-top:2px}
.lv[aria-pressed=true]{background:var(--lc);color:var(--lon);box-shadow:0 2px 8px rgba(16,24,40,.25)}
.lv[aria-pressed=true] .n{opacity:.95}
.lv.zero:not([aria-pressed=true]){opacity:.45}
/* Recherche */
.search{position:relative;margin:0 0 14px}
.search span{position:absolute;left:13px;top:50%;transform:translateY(-50%);font-size:15px;opacity:.6;pointer-events:none}
#q{width:100%;min-height:46px;padding:10px 12px 10px 38px;border:1.5px solid var(--line);border-radius:12px;font-size:16px;background:#fff;color:var(--ink)}
#q:focus{outline:none;border-color:#1f2a44}
label.opt{display:flex;gap:8px;align-items:center;font-size:13.5px;color:#4b3a7a;margin:-4px 2px 14px;cursor:pointer}
label.opt input{width:18px;height:18px}
/* Barre de sélection collante */
#bar{position:sticky;top:6px;z-index:20;display:flex;align-items:center;gap:10px;width:100%;margin:4px 0 14px;padding:8px 8px 8px 12px;background:#fff;border:1px solid var(--line);border-left:7px solid var(--c);border-radius:14px;box-shadow:0 4px 14px rgba(16,24,40,.14);text-align:left;color:var(--ink)}
#bar .be{font-size:20px;flex:0 0 auto}
#bar .bt{flex:1 1 auto;min-width:0;font-size:14.5px;line-height:1.2;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#bar .bt b{font-weight:800}
#bar .bl{font-weight:800;color:var(--blc)}
#bar .bn{flex:0 0 auto;font-size:12.5px;font-weight:800;background:var(--t);color:var(--d);border-radius:999px;padding:3px 9px}
#bar .bf{flex:0 0 auto;font-size:12.5px;font-weight:700;color:#fff;background:#1f2a44;border-radius:10px;padding:7px 9px}
/* Résultats */
.grp{display:flex;align-items:center;gap:8px;margin:18px 0 10px;padding:8px 12px;border-radius:10px;background:var(--lt);color:var(--ld);font-size:14px;font-weight:800;letter-spacing:.05em;text-transform:uppercase}
.grp:first-child{margin-top:0}
.grp i{width:12px;height:12px;border-radius:50%;background:var(--lc);display:inline-block}
.grp span{margin-left:auto;font-size:13px;letter-spacing:0}
ul.list{list-style:none;margin:0;padding:0}
a.ex{display:block;background:var(--card);border:1px solid var(--line);border-left:7px solid var(--lc);border-radius:14px;padding:12px 14px 12px 13px;margin:0 0 12px;color:var(--ink);text-decoration:none;box-shadow:0 1px 3px rgba(16,24,40,.06)}
a.ex:active{transform:scale(.99);background:#fafbff}
.ex .l1{display:flex;align-items:baseline;gap:8px}
.ex .yr{flex:1 1 auto;font-size:17.5px;font-weight:800;letter-spacing:-.01em}
.ex .pg{flex:0 0 auto;font-size:12px;font-weight:700;color:#344054;background:#eef1f6;border-radius:999px;padding:3px 9px;white-space:nowrap}
.ex .l2{margin-top:3px;font-size:14.5px;font-weight:600;color:#344054}
.ex .l2 b{color:var(--ink);white-space:nowrap}
.ex .ds{margin-top:5px;font-size:14.5px;color:var(--ink)}
.tags{display:flex;flex-wrap:wrap;gap:6px;margin-top:9px}
.tag{font-size:12px;font-weight:600;background:var(--t);color:var(--d);border-radius:6px;padding:2px 8px}
.tag.lvt{background:var(--lt);color:var(--ld)}
.mix{font-size:12px;font-weight:600;background:var(--dt);color:var(--dd);border-radius:6px;padding:2px 8px}

.empty{background:#fff;border:1px dashed #c8cdd8;border-radius:14px;color:var(--mute);padding:18px 14px;text-align:center}
/* QCM */
details.qcm{margin-top:26px;background:#fff;border:1px solid #c9cfe0;border-radius:16px;overflow:hidden}
details.qcm summary{list-style:none;display:flex;align-items:center;gap:10px;cursor:pointer;padding:13px 14px;background:#334155;color:#fff;font-weight:800;font-size:15px}
details.qcm summary::-webkit-details-marker{display:none}
details.qcm summary .qi{font-size:18px}
details.qcm summary .qt{flex:1 1 auto;min-width:0}
details.qcm summary .qt small{display:block;font-weight:500;font-size:12.5px;color:#cbd5e1;margin-top:1px}
details.qcm summary .chev{transition:transform .2s;font-size:13px}
details.qcm[open] summary .chev{transform:rotate(180deg)}
#qcmList{padding:12px 10px 4px;background:#f6f7fb}
#qcmList a.ex{border-left-color:var(--c);padding:9px 12px;margin-bottom:8px}
#qcmList .yr{font-size:15px}
#qcmList .ds{margin-top:2px;font-size:14px}
#qcmList .tags{margin-top:6px}
footer{max-width:720px;margin:0 auto;padding:0 16px 50px;color:var(--mute);font-size:13px}
footer h3{font-size:13.5px;color:var(--ink);margin:18px 0 4px}
footer a{color:#2551c4}
.up{display:block;margin:20px auto 0;border:1px solid var(--line);background:#fff;border-radius:12px;padding:10px 16px;font-weight:700;color:#1f2a44}
@media (min-width:640px){.cats{grid-template-columns:repeat(3,1fr)}.cat.all{grid-column:auto}}
</style>
</head>
<body>
<div class="top" id="top">
  <h1>📚 Anciens sujets d'examen de physique</h1>
  <p>Maturité fédérale · discipline fondamentale · classés par thème et par niveau</p>
</div>
<div class="wrap">
  <section class="blk b1">
    <h2><span class="num">1</span>Catégorie</h2>
    <div class="cats" id="cats" role="group" aria-label="Catégorie"></div>
  </section>
  <section class="blk b2" id="b2">
    <h2><span class="num">2</span>Sous-catégorie <span class="sel" id="subSel"></span></h2>
    <div class="subs" id="subs" role="group" aria-label="Sous-catégorie"></div>
  </section>
  <section class="blk b3" id="b3">
    <h2><span class="num">3</span>Niveau</h2>
    <div class="seg" id="lvls" role="group" aria-label="Niveau"></div>
  </section>
  <div class="search"><span>🔍</span><input id="q" type="search" placeholder="Rechercher : ampoule, 2019, glace, ressort…" autocomplete="off"></div>
  <div id="anchor"></div>
  <button type="button" id="bar" aria-label="Revenir aux filtres"></button>
  <div id="results"></div>
  <details class="qcm" id="qcmBox">
    <summary><span class="qi">📝</span><span class="qt" id="qcmTitle">QCM</span><span class="chev">▼</span></summary>
    <div id="qcmList"></div>
  </details>
  <button type="button" class="up" id="up">↑ Revenir aux filtres</button>
</div>
<footer id="foot"></footer>

e-2026-hiver-suisse.pdf", "page": 3, "lien": "https://www.ugomazier-maths.ch/examens/Physique/sujet-examen-maturite-federale-physique-2026-hiver-suisse.pdf#page=3", "exercice": "QCM 7", "question": "7", "points": 1, "categories": ["Électricité"], "sous_categories": ["Grandeurs, unités, définitions"], "codes": ["E.uni"], "niveau": null, "themes_melanges": null, "description": "Unité qui n'est pas une tension"}, {"type": "qcm", "annee": 2026, "session": "hiver", "url": "https://www.ugomazier-maths.ch/examens/Physique/sujet-examen-maturite-federale-physique-2026-hiver-suisse.pdf", "page": 3, "lien": "https://www.ugomazier-maths.ch/examens/Physique/sujet-examen-maturite-federale-physique-2026-hiver-suisse.pdf#page=3", "exercice": "QCM 8", "question": "8", "points": 1, "categories": ["Électricité"], "sous_categories": ["Puissance électrique, énergie, effet Joule"], "codes": ["E.pui"], "niveau": null, "themes_melanges": null, "description": "Fer à repasser 50 Ω : énergie en une heure"}, {"type": "qcm", "annee": 2026, "session": "hiver", "url": "https://www.ugomazier-maths.ch/examens/Physique/sujet-examen-maturite-federale-physique-2026-hiver-suisse.pdf", "page": 3, "lien": "https://www.ugomazier-maths.ch/examens/Physique/sujet-examen-maturite-federale-physique-2026-hiver-suisse.pdf#page=3", "exercice": "QCM 9", "question": "9", "points": 1, "categories": ["Magnétisme"], "sous_categories": ["Force de Laplace (fil dans un champ B)"], "codes": ["B.lap"], "niveau": null, "themes_melanges": null, "description": "Force magnétique sur un fil dans un champ B"}, {"type": "qcm", "annee": 2026, "session": "hiver", "url": "https://www.ugomazier-maths.ch/examens/Physique/sujet-examen-maturite-federale-physique-2026-hiver-suisse.pdf", "page": 3, "lien": "https://www.ugomazier-maths.ch/examens/Physique/sujet-examen-maturite-federale-physique-2026-hiver-suisse.pdf#page=3", "exercice": "QCM 10", "question": "10", "points": 1, "categories": ["Physique moderne"], "sous_categories": ["Désintégrations α, β, γ, fission"], "codes": ["N.rad"], "niveau": null, "themes_melanges": null, "description": "Radium 226 : désintégration alpha"}]};
const META=DATA.meta, ALL=DATA.entrees;
const EX=ALL.filter(e=>e.type==='exercice'), QCM=ALL.filter(e=>e.type==='qcm');
const CATS=META.categories;
const SUBNAME={},SUB2CAT={};
CATS.forEach(c=>c.sous_categories.forEach(s=>{SUBNAME[s.code]=s.nom;SUB2CAT[s.code]=c.code;}));
/* Couleur de chaque catégorie : c = couleur pleine, t = teinte claire, d = texte foncé, on = texte sur fond plein */
const CS={
 tous:{e:'📚',c:'#1f2a44',t:'#e7eaf2',d:'#1f2a44',on:'#fff'},
 M:{e:'⚙️',c:'#2563eb',t:'#e3edff',d:'#1e3a8a',on:'#fff'},
 H:{e:'💧',c:'#0891b2',t:'#dcf5fa',d:'#155e75',on:'#fff'},
 C:{e:'🔥',c:'#ea580c',t:'#ffe9d9',d:'#9a3412',on:'#fff'},
 E:{e:'⚡',c:'#fbbf24',t:'#fff4cc',d:'#854d0e',on:'#3d2600'},
 S:{e:'🎈',c:'#9333ea',t:'#f3e8ff',d:'#6b21a8',on:'#fff'},
 B:{e:'🧲',c:'#4f46e5',t:'#e6e6ff',d:'#3730a3',on:'#fff'},
 O:{e:'🔦',c:'#65a30d',t:'#ecf8d6',d:'#3f6212',on:'#fff'},
 W:{e:'🌊',c:'#db2777',t:'#fde5f1',d:'#9d174d',on:'#fff'},
 N:{e:'⚛️',c:'#475569',t:'#e9eef4',d:'#1e293b',on:'#fff'},
 G:{e:'📏',c:'#78716c',t:'#f0eeec',d:'#44403c',on:'#fff'}};
const LS={tous:{c:'#344054',t:'#ffffff',d:'#344054',on:'#fff'},
 facile:{c:'#16a34a',t:'#dcfce7',d:'#166534',on:'#fff'},
 moyen:{c:'#f59f00',t:'#fff1d6',d:'#8a4f00',on:'#2b1700'},
 dur:{c:'#dc2626',t:'#fee2e2',d:'#991b1b',on:'#fff'}};
const cs=k=>CS[k]||CS.N;
const cvars=k=>{const s=cs(k);return '--c:'+s.c+';--t:'+s.t+';--d:'+s.d+';--on:'+s.on;};
const lvars=k=>{const s=LS[k]||LS.tous;return '--lc:'+s.c+';--lt:'+s.t+';--ld:'+s.d+';--lon:'+s.on;};
const SR=s=>s==='été'?1:0;
function cmp(a,b){return b.annee-a.annee||SR(b.session)-SR(a.session)||a.page-b.page||a.exercice.localeCompare(b.exercice,'fr',{numeric:true});}
const LV=[['tous','Tous'],['facile','Facile'],['moyen','Moyen'],['dur','Dur']];
const st={cat:'tous',sub:'tous',lvl:'tous',q:'',hide:false,qcm:false};
const $=id=>document.getElementById(id);
function esc(s){return String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));}
function norm(s){return String(s).toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'');}
ALL.forEach(e=>{e._cats=[...new Set(e.codes.map(c=>SUB2CAT[c]))];
  e._txt=norm([e.annee,e.session,e.exercice,e.description,e.sous_categories.join(' '),e.categories.join(' '),e.themes_melanges||'',e.niveau||''].join(' '));});
let hidden=e=>false;

function inCat(e,cat,sub){if(sub!=='tous')return e.codes.includes(sub);if(cat!=='tous')return e._cats.includes(cat);return true;}
function matchQ(e){if(!st.q)return true;return norm(st.q).split(/\s+/).filter(Boolean).every(w=>e._txt.includes(w));}
function base(list,cat,sub){return list.filter(e=>inCat(e,cat,sub)&&matchQ(e)&&!hidden(e));}
function lvlFilter(list){return st.lvl==='tous'?list:list.filter(e=>e.niveau===st.lvl);}
function btn(cls,style,html,pressed,on){const b=document.createElement('button');b.type='button';b.className=cls;
  if(style)b.setAttribute('style',style);b.setAttribute('aria-pressed',pressed?'true':'false');b.innerHTML=html;b.onclick=on;return b;}
const catName=k=>k==='tous'?'Toutes catégories':CATS.find(x=>x.code===k).nom;
const lvlName=k=>LV.find(x=>x[0]===k)[1];
function render(){
  /* 1. Catégories */
  const cats=$('cats');cats.innerHTML='';
  const nAll=lvlFilter(base(EX,'tous','tous')).length;
  cats.appendChild(btn('cat all',cvars('tous'),'<span class="ce">📚</span><span class="cn">Toutes les catégories<span class="cc">'+nAll+' exercice'+(nAll>1?'s':'')+'</span></span>',st.cat==='tous',()=>pickCat('tous')));
  CATS.forEach(c=>{const n=lvlFilter(base(EX,c.code,'tous')).length;const nq=base(QCM,c.code,'tous').length;
    if(!(EX.some(e=>e._cats.includes(c.code))||nq))return;
    const b=btn('cat'+(n?'':' zero'),cvars(c.code),'<span class="ce">'+cs(c.code).e+'</span><span class="cn">'+esc(c.nom)+'<span class="cc">'+n+' exercice'+(n>1?'s':'')+'</span></span>',st.cat===c.code,()=>pickCat(c.code));
    cats.appendChild(b);});
  /* 2. Sous-catégories */
  const b2=$('b2'),subs=$('subs');subs.innerHTML='';
  if(st.cat==='tous'){b2.setAttribute('style','');b2.className='blk b2 off';subs.innerHTML='<p class="hint">Choisis d’abord une catégorie (facultatif).</p>';$('subSel').textContent='';}
  else{const c=CATS.find(x=>x.code===st.cat);const s=cs(st.cat);b2.className='blk b2';
    b2.setAttribute('style',cvars(st.cat)+';--c2:'+s.c);
    $('subSel').textContent=st.sub==='tous'?'toutes':SUBNAME[st.sub];
    if(c.sous_categories.length>1){
      subs.appendChild(btn('sub','','Toutes',st.sub==='tous',()=>{st.sub='tous';render();}));
      c.sous_categories.forEach(x=>{const n=lvlFilter(base(EX,st.cat,x.code)).length,nq=base(QCM,st.cat,x.code).length;
        subs.appendChild(btn('sub'+(n?'':' zero'),'',esc(x.nom)+'<span class="n">'+n+' ex.'+(nq?' · '+nq+' QCM':'')+'</span>',st.sub===x.code,()=>{st.sub=x.code;render();}));});}
    else subs.innerHTML='<p class="hint">Une seule sous-catégorie : '+esc(c.sous_categories[0].nom)+'.</p>';}
  /* 3. Niveaux */
  const pool=base(EX,st.cat,st.sub);
  const lv=$('lvls');lv.innerHTML='';
  LV.forEach(([k,l])=>{const n=k==='tous'?pool.length:pool.filter(e=>e.niveau===k).length;
    lv.appendChild(btn('lv'+(n?'':' zero'),lvars(k),l+'<span class="n">'+n+'</span>',st.lvl===k,()=>pickLvl(k)));});
  /* Barre de sélection */
  const shown=lvlFilter(pool).slice().sort(cmp);
  const bar=$('bar');bar.setAttribute('style',cvars(st.cat)+';--blc:'+(st.lvl==='tous'?'#344054':LS[st.lvl].d));
  const where=st.sub!=='tous'?SUBNAME[st.sub]:catName(st.cat);
  bar.innerHTML='<span class="be">'+cs(st.cat).e+'</span><span class="bt"><b>'+esc(where)+'</b> · <span class="bl">'+(st.lvl==='tous'?'tous niveaux':lvlName(st.lvl))+'</span>'+(st.q?' · « '+esc(st.q)+' »':'')+'</span><span class="bn">'+shown.length+' ex.</span><span class="bf">Filtres ↑</span>';
  /* Résultats */
  const res=$('results');res.innerHTML='';
  const groups=st.lvl==='tous'?['facile','moyen','dur']:[st.lvl];
  let any=false;
  groups.forEach(g=>{const L=shown.filter(e=>e.niveau===g);if(!L.length)return;any=true;
    if(st.lvl==='tous'){const h=document.createElement('h3');h.className='grp';h.setAttribute('style',lvars(g));
      h.innerHTML='<i></i>'+lvlName(g)+'<span>'+L.length+' exercice'+(L.length>1?'s':'')+'</span>';res.appendChild(h);}
    const ul=document.createElement('ul');ul.className='list';L.forEach(e=>ul.appendChild(item(e)));res.appendChild(ul);});
  if(!any)res.innerHTML='<div class="empty">Aucun exercice pour ce filtre.<br>Essaie « Tous » les niveaux ou une autre catégorie.</div>';
  /* QCM */
  const qs=base(QCM,st.cat,st.sub).slice().sort(cmp);
  $('qcmTitle').innerHTML='QCM · '+qs.length+' question'+(qs.length>1?'s':'')+'<small>'+esc(where)+' · touche pour '+(st.qcm?'replier':'afficher')+'</small>';
  const ql=$('qcmList');ql.innerHTML='';
  if(!qs.length)ql.innerHTML='<div class="empty">Aucune question de QCM pour ce filtre.</div>';
  else{const ul=document.createElement('ul');ul.className='list';qs.forEach(e=>ul.appendChild(item(e,true)));ql.appendChild(ul);}
  $('qcmBox').open=st.qcm;
  writeHash();
}
function item(e,isQ){const li=document.createElement('li');
  const mainCat=e._cats[0];
  let tags='';
  e.codes.forEach(c=>tags+='<span class="tag" style="'+cvars(SUB2CAT[c])+'">'+esc(SUBNAME[c])+'</span>');
  if(!isQ&&st.lvl==='tous'&&st.q)tags+='<span class="tag lvt" style="'+lvars(e.niveau)+'">'+lvlName(e.niveau)+'</span>';
  if(e.themes_melanges)tags+='<span class="mix" title="'+esc(e.themes_melanges)+'">🔀 Mélange de thèmes</span>';
  
  const pts=e.points!=null&&!isQ?' · <b>'+String(e.points).replace('.',',')+' pts</b>':'';
  const l2=isQ?'':'<div class="l2">'+esc(e.exercice)+pts+'</div>';
  const yr='Physique '+e.annee+' '+e.session+(isQ?' · QCM '+esc(e.question):'');
  li.innerHTML='<a class="ex" style="'+(isQ?cvars(mainCat):lvars(e.niveau))+'" href="'+esc(e.lien)+'" target="_blank" rel="noopener">'+
    '<div class="l1"><span class="yr">'+yr+'</span><span class="pg">p. '+e.page+' ↗</span></div>'+l2+
    '<div class="ds">'+esc(e.description)+'</div><div class="tags">'+tags+'</div></a>';
  return li;}
function pickCat(k){st.cat=k;st.sub='tous';render();
  /* si le bloc Niveau sort de l'écran, on le fait apparaître */
  const r=$('b3').getBoundingClientRect();if(r.bottom>innerHeight-8)window.scrollBy({top:r.bottom-innerHeight+80,behavior:'smooth'});}
function pickLvl(k){st.lvl=k;render();
  /* on fait remonter la liste pour la voir tout de suite */
  const r=$('anchor').getBoundingClientRect();if(r.top>innerHeight*0.5)window.scrollTo({top:r.top+scrollY-2,behavior:'smooth'});}
function toTop(){window.scrollTo({top:0,behavior:'smooth'});}
$('bar').onclick=toTop;$('up').onclick=toTop;
function writeHash(){const p=new URLSearchParams();if(st.cat!=='tous')p.set('cat',st.cat);if(st.sub!=='tous')p.set('sub',st.sub);
  if(st.lvl!=='tous')p.set('niveau',st.lvl);if(st.q)p.set('q',st.q);if(st.qcm)p.set('qcm','1');
  const h=p.toString();history.replaceState(null,'',h?'#'+h:location.pathname+location.search);}
function readHash(){const p=new URLSearchParams(location.hash.slice(1));st.cat='tous';st.sub='tous';st.lvl='tous';
  const c=p.get('cat');if(c&&CATS.some(x=>x.code===c))st.cat=c;
  const s=p.get('sub');if(s&&SUB2CAT[s]){st.sub=s;st.cat=SUB2CAT[s];}
  const l=p.get('niveau');if(l&&LV.some(x=>x[0]===l))st.lvl=l;
  st.q=p.get('q')||'';st.qcm=p.get('qcm')==='1';
  
  $('q').value=st.q;}
$('q').addEventListener('input',e=>{st.q=e.target.value.trim();render();});

$('qcmBox').addEventListener('toggle',()=>{if(st.qcm!==$('qcmBox').open){st.qcm=$('qcmBox').open;render();}});
function foot(){
  let h='<h3>Comment c\'est classé</h3><p>'+esc(META.regle_niveau)+' Un exercice qui touche plusieurs catégories apparaît dans chacune d\'elles, avec l\'étiquette rouge « 🔀 Mélange de thèmes ».</p>';
  if(META.note_optique)h+='<p>'+esc(META.note_optique)+'</p>';
  h+='<p>Toucher un exercice ouvre le PDF dans un nouvel onglet à la page indiquée. Certains lecteurs ignorent la page : le numéro « p. N » est rappelé sur chaque exercice.</p>';
  h+='<h3>Corpus</h3><p>'+META.sessions.length+' sessions indexées ('+META.sessions[0]+' → '+META.sessions[META.sessions.length-1]+'), '+EX.length+' exercices ouverts et '+QCM.length+' questions de QCM. Sessions absentes du site : '+META.sessions_absentes.join(', ')+'.</p>';
  Object.entries(META.notes).forEach(([k,v])=>h+='<p><b>'+esc(k)+'</b> : '+esc(v)+'</p>');
  h+='<p>Source : <a href="'+esc(META.source)+'" target="_blank" rel="noopener">ugomazier-maths.ch</a></p>';
  $('foot').innerHTML=h;}
readHash();foot();render();
window.addEventListener('hashchange',()=>{readHash();render();});
</script>
