<title>Anciens sujets d'examen de physique – index par thème</title>
<style>
:root{--bg:#f6f7fb;--card:#fff;--ink:#1d2433;--mute:#667085;--line:#e4e7ee;--acc:#2f5bd3;--accbg:#e8eefc;
--f:#1f8a4c;--fbg:#e3f5ea;--m:#b7791f;--mbg:#fdf3e1;--d:#c0392b;--dbg:#fbe7e5}
*{box-sizing:border-box}
body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;background:var(--bg);color:var(--ink);font-size:15px;line-height:1.4}
header{position:sticky;top:0;z-index:5;background:var(--card);border-bottom:1px solid var(--line);padding:10px 14px 8px;box-shadow:0 1px 6px rgba(0,0,0,.04)}
h1{font-size:17px;margin:0 0 8px}
h1 small{font-weight:400;color:var(--mute);font-size:13px}
.row{display:flex;flex-wrap:nowrap;gap:6px;overflow-x:auto;padding-bottom:6px;scrollbar-width:thin}
.row.wrap{flex-wrap:wrap;overflow:visible}
.chip{flex:0 0 auto;border:1px solid var(--line);background:#fff;color:var(--ink);border-radius:999px;padding:6px 11px;font-size:14px;cursor:pointer;white-space:nowrap}
.chip .n{color:var(--mute);font-size:12px;margin-left:4px}
.chip[aria-pressed=true]{background:var(--acc);border-color:var(--acc);color:#fff}
.chip[aria-pressed=true] .n{color:#dfe6ff}
.chip.sub{font-size:13px;padding:5px 10px}
.chip.lv-facile[aria-pressed=true]{background:var(--f);border-color:var(--f)}
.chip.lv-moyen[aria-pressed=true]{background:var(--m);border-color:var(--m)}
.chip.lv-dur[aria-pressed=true]{background:var(--d);border-color:var(--d)}
.chip:disabled{opacity:.4;cursor:default}
.tools{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-top:2px}
#q{flex:1 1 220px;min-width:0;padding:8px 10px;border:1px solid var(--line);border-radius:8px;font-size:15px}
label.opt{font-size:13px;color:var(--mute);display:flex;gap:5px;align-items:center;cursor:pointer}
main{max-width:900px;margin:0 auto;padding:10px 12px 40px}
.summary{color:var(--mute);font-size:13px;margin:4px 2px 10px}
h2{font-size:15px;margin:18px 2px 6px;display:flex;align-items:center;gap:8px}
.pill{display:inline-block;border-radius:6px;padding:1px 7px;font-size:12px;font-weight:600}
.pf{background:var(--fbg);color:var(--f)}.pm{background:var(--mbg);color:var(--m)}.pd{background:var(--dbg);color:var(--d)}
ul.list{list-style:none;margin:0;padding:0}
ul.list li{background:var(--card);border:1px solid var(--line);border-radius:10px;margin:6px 0;}
ul.list a{display:block;padding:9px 12px;color:var(--ink);text-decoration:none}
ul.list a:hover{background:#fafbff}
.t{font-weight:600}
.t .y{color:var(--acc)}
.meta{font-size:12.5px;color:var(--mute);margin-top:3px;display:flex;flex-wrap:wrap;gap:4px 8px;align-items:center}
.tag{background:#f1f3f8;border-radius:5px;padding:1px 6px}
.mix{background:var(--dbg);color:var(--d);border-radius:5px;padding:1px 6px}
details.qcm{margin-top:22px;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:4px 10px}
details.qcm summary{cursor:pointer;font-weight:600;padding:8px 2px}
details.qcm ul.list li{border-radius:8px}
details.qcm ul.list a{padding:7px 10px}
.empty{color:var(--mute);padding:14px 4px}
footer{max-width:900px;margin:0 auto;padding:0 14px 40px;color:var(--mute);font-size:12.5px}
footer h3{font-size:13px;color:var(--ink);margin:16px 0 4px}
@media (max-width:560px){header{position:static}h1{font-size:15px}.chip{font-size:13px;padding:6px 9px}}
</style>

const META=DATA.meta, ALL=DATA.entrees;
const EX=ALL.filter(e=>e.type==='exercice'), QCM=ALL.filter(e=>e.type==='qcm');
const CATS=META.categories;
const SUBNAME={},SUB2CAT={};
CATS.forEach(c=>c.sous_categories.forEach(s=>{SUBNAME[s.code]=s.nom;SUB2CAT[s.code]=c.code;}));
const SR=s=>s==='été'?1:0;
function cmp(a,b){return b.annee-a.annee||SR(b.session)-SR(a.session)||a.page-b.page||a.exercice.localeCompare(b.exercice,'fr',{numeric:true});}
const LV=[['tous','Tous'],['facile','Facile'],['moyen','Moyen'],['dur','Dur']];
const st={cat:'tous',sub:'tous',lvl:'tous',q:'',hide:false,qcm:false};
const $=id=>document.getElementById(id);
function esc(s){return String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));}
function norm(s){return String(s).toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'');}
ALL.forEach(e=>{e._cats=[...new Set(e.codes.map(c=>SUB2CAT[c]))];
  e._txt=norm([e.annee,e.session,e.exercice,e.description,e.sous_categories.join(' '),e.categories.join(' '),e.themes_melanges||'',e.niveau||''].join(' '));});
function inCat(e,cat,sub){if(sub!=='tous')return e.codes.includes(sub);if(cat!=='tous')return e._cats.includes(cat);return true;}
function matchQ(e){if(!st.q)return true;return norm(st.q).split(/\s+/).filter(Boolean).every(w=>e._txt.includes(w));}
function base(list,cat,sub){return list.filter(e=>inCat(e,cat,sub)&&matchQ(e));}
function chip(label,n,pressed,on,cls,dis){const b=document.createElement('button');b.type='button';b.className='chip '+(cls||'');
  b.setAttribute('aria-pressed',pressed?'true':'false');b.innerHTML=esc(label)+(n!=null?'<span class="n">'+n+'</span>':'');
  if(dis&&!pressed)b.disabled=true;b.onclick=on;return b;}
function lvlFilter(list){return st.lvl==='tous'?list:list.filter(e=>e.niveau===st.lvl);}
function render(){
  const cats=$('cats');cats.innerHTML='';
  cats.appendChild(chip('Toutes',lvlFilter(base(EX,'tous','tous')).length,st.cat==='tous',()=>{st.cat='tous';st.sub='tous';upd();}));
  CATS.forEach(c=>{const n=lvlFilter(base(EX,c.code,'tous')).length;const nq=base(QCM,c.code,'tous').length;
    if(EX.some(e=>e._cats.includes(c.code))||nq) cats.appendChild(chip(c.nom,n,st.cat===c.code,()=>{st.cat=c.code;st.sub='tous';upd();}));});
  const subs=$('subs');subs.innerHTML='';
  if(st.cat!=='tous'){const c=CATS.find(x=>x.code===st.cat);
    if(c.sous_categories.length>1){subs.appendChild(chip('Toutes les sous-catégories',null,st.sub==='tous',()=>{st.sub='tous';upd();},'sub'));
      c.sous_categories.forEach(s=>subs.appendChild(chip(s.nom,lvlFilter(base(EX,st.cat,s.code)).length,st.sub===s.code,()=>{st.sub=s.code;upd();},'sub')));}}
  subs.style.display=subs.children.length?'flex':'none';
  const pool=base(EX,st.cat,st.sub);
  const lv=$('lvls');lv.innerHTML='';
  LV.forEach(([k,l])=>{const n=k==='tous'?pool.length:pool.filter(e=>e.niveau===k).length;
    lv.appendChild(chip(l,n,st.lvl===k,()=>{st.lvl=k;upd();},'lv-'+k));});
  const shown=lvlFilter(pool).slice().sort(cmp);
  const res=$('results');res.innerHTML='';
  const where=(st.sub!=='tous'?SUBNAME[st.sub]:st.cat!=='tous'?CATS.find(x=>x.code===st.cat).nom:'toutes catégories');
  $('summary').textContent=shown.length+' exercice'+(shown.length>1?'s':'')+' · '+where+(st.lvl!=='tous'?' · niveau '+st.lvl:'')+(st.q?' · « '+st.q+' »':'');
  const groups=st.lvl==='tous'?['facile','moyen','dur']:[st.lvl];
  let any=false;
  groups.forEach(g=>{const L=shown.filter(e=>e.niveau===g);if(!L.length)return;any=true;
    if(st.lvl==='tous'){const h=document.createElement('h2');h.innerHTML='<span class="pill p'+g[0]+'">'+g.toUpperCase()+'</span> '+L.length;res.appendChild(h);}
    const ul=document.createElement('ul');ul.className='list';L.forEach(e=>ul.appendChild(item(e)));res.appendChild(ul);});
  if(!any)res.innerHTML='<div class="empty">Aucun exercice pour ce filtre.</div>';
  const qs=base(QCM,st.cat,st.sub).slice().sort(cmp);
  $('qcmTitle').textContent='QCM – '+qs.length+' question'+(qs.length>1?'s':'')+' ('+where+')';
  const ql=$('qcmList');ql.innerHTML='';
  if(!qs.length)ql.innerHTML='<div class="empty">Aucune question de QCM pour ce filtre.</div>';
  else{const ul=document.createElement('ul');ul.className='list';qs.forEach(e=>ul.appendChild(item(e,true)));ql.appendChild(ul);}
  $('qcmBox').open=st.qcm;
  writeHash();
}
function item(e,isQ){const li=document.createElement('li');
  const pts=e.points!=null&&!isQ?' ('+String(e.points).replace('.',',')+' pts)':'';
  const lab=isQ?'QCM question '+e.question:e.exercice;
  let m='<span class="tag">p. '+e.page+'</span>';
  e.codes.forEach(c=>m+='<span class="tag">'+esc(SUBNAME[c])+'</span>');
  if(e.themes_melanges)m+='<span class="mix">Mélange : '+esc(e.themes_melanges)+'</span>';
  li.innerHTML='<a href="'+esc(e.lien)+'" target="_blank" rel="noopener"><div class="t"><span class="y">Physique '+e.annee+' '+e.session+'</span> · '+esc(lab)+pts+' · '+esc(e.description)+'</div><div class="meta">'+m+'</div></a>';
  return li;}
function writeHash(){const p=new URLSearchParams();if(st.cat!=='tous')p.set('cat',st.cat);if(st.sub!=='tous')p.set('sub',st.sub);
  if(st.lvl!=='tous')p.set('niveau',st.lvl);if(st.q)p.set('q',st.q);if(st.qcm)p.set('qcm','1');
  const h=p.toString();history.replaceState(null,'',h?'#'+h:location.pathname+location.search);}
function readHash(){const p=new URLSearchParams(location.hash.slice(1));st.cat='tous';st.sub='tous';st.lvl='tous';
  const c=p.get('cat');if(c&&CATS.some(x=>x.code===c))st.cat=c;
  const s=p.get('sub');if(s&&SUB2CAT[s]){st.sub=s;st.cat=SUB2CAT[s];}
  const l=p.get('niveau');if(l&&LV.some(x=>x[0]===l))st.lvl=l;
  st.q=p.get('q')||'';st.qcm=p.get('qcm')==='1';
  $('q').value=st.q;}
function upd(){render();}
$('q').addEventListener('input',e=>{st.q=e.target.value.trim();render();});
$('qcmBox').addEventListener('toggle',()=>{st.qcm=$('qcmBox').open;writeHash();});
function foot(){const ns=new Set(EX.map(e=>e.annee+' '+e.session));
  let h='<h3>Comment c\'est classé</h3><p>'+esc(META.regle_niveau)+' Un exercice qui touche plusieurs catégories apparaît dans chacune d\'elles, avec les thèmes mélangés indiqués en rouge.</p>';
  h+='<p>Un clic ouvre le PDF dans un nouvel onglet à la page indiquée (#page=N). Certains lecteurs (Safari sur iPhone, par ex.) ignorent la page : le numéro « p. N » est rappelé sous chaque ligne.</p>';
  h+='<h3>Corpus</h3><p>'+META.sessions.length+' sessions indexées ('+META.sessions[0]+' → '+META.sessions[META.sessions.length-1]+'), '+EX.length+' exercices ouverts et '+QCM.length+' questions de QCM. Sessions absentes du site : '+META.sessions_absentes.join(', ')+'.</p>';
  Object.entries(META.notes).forEach(([k,v])=>h+='<p><b>'+esc(k)+'</b> : '+esc(v)+'</p>');
  h+='<p>Source : <a href="'+esc(META.source)+'" target="_blank" rel="noopener">ugomazier-maths.ch</a></p>';
  $('foot').innerHTML=h;}
readHash();foot();render();
window.addEventListener('hashchange',()=>{readHash();render();});
</script>
